name: Behavior Bug
description: Report a bug where Tuff does not behave like vanilla/Folia. Paper and Bukkit plugins are not guaranteed to work; do not report plugin bugs here.
labels: ["status: needs triage", "type: bug"]
body:
  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to see.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Observed/Actual behavior
      description: What you actually saw.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps/models to reproduce
      description: Build schematic, video, or detailed instructions that let us reproduce the issue.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Plugin and Datapack List
      description: |
        All plugins and datapacks running on your server.
        To list plugins, run `/plugins`. For datapacks, run `/datapack list`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Tuff version
      description: |
        Run `/version` on your server and **paste** the full, unmodified output here.
        "latest" is *not* a version; we need the actual output. Do NOT send a screenshot.
        <details>
        <summary>Example</summary>

        ```
        > version
        [10:00:11 INFO]: Checking version, please wait...
        [10:00:12 INFO]: This server is running Tuff version 26.3-build.12-abc1234 (MC: 26.3)
        You are running the latest Tuff build
        ```

        </details>
    validations:
      required: true

  - type: textarea
    attributes:
      label: Other
      description: Anything else that might help.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before submitting, make sure that:

        1. You are running the latest Tuff build from [our releases page](https://github.com/bejiihiu/tuff/releases).
        2. You searched and there is no open issue for this already.
        3. The issue is not caused by a plugin that is not Folia-compatible.

        Tuff is a Folia fork. If the same thing happens on upstream Folia, please report it there instead.
