name: Feature Request
description: Suggest an idea or a new system for Tuff
labels: ["status: needs triage", "type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest something. Describe the problem first, the solution second.

  - type: textarea
    attributes:
      label: What problem are you trying to solve?
      description: The use case, not the implementation.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: How you imagine it working. Config keys, commands, API - whatever you have in mind.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including plugins that already do it.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Before requesting, check that the feature does not already exist in Tuff, Folia or Paper.
