name: Server Crash or Stacktrace
description: Report a server crash or a stacktrace printed in the console.
labels: ["status: needs triage", "type: crash"]
body:
  - type: textarea
    attributes:
      label: Stacktrace
      description: |
        Paste the full stacktrace here (or a link to a paste site such as mclo.gs). Do not send a screenshot.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: What was happening right before the crash.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Plugin and Datapack List
      description: Output of `/plugins` and `/datapack list`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Tuff version
      description: |
        Full output of `/version` (or the startup line that contains the version).
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        If the crash log says `DO NOT REPORT THIS TO FOLIA`, that also applies to us - it usually means a plugin or a
        modified server jar is involved.
