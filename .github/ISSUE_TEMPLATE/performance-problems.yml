name: Performance Problem
description: Report TPS drops, lag spikes or other performance issues on Tuff.
labels: ["status: needs triage", "type: performance"]
body:
  - type: textarea
    attributes:
      label: Description
      description: What kind of lag you see, when it happens and how long it lasts.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Timings / profiler output
      description: |
        Paste your spark or Tuff profiler output (a link to spark is fine). `spark profiler --timeout 30` usually shows
        the culprit. Without data we can only guess.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Server hardware and JVM flags
      description: CPU model, core count, RAM, and the full java command line (GC flags matter a lot for region threading).
    validations:
      required: true

  - type: textarea
    attributes:
      label: Plugin and Datapack List
      description: Output of `/plugins` and `/datapack list`.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Tuff version
      description: Full output of `/version`.
    validations:
      required: true
