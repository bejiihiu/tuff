name: Patch guard

# Full builds of ver/26.3.x now run on every push (build.yml). This keeps the
# committed patch invariants checked in seconds too, so a broken patch number or a
# dropped hook is named right away instead of 20 minutes into the build. Upstream
# conflicts are the weekly upstream-drift workflow's job.
on:
  push:
    branches:
      - ver/26.3.x
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check patch invariants
        run: bash .github/scripts/guard-repo.sh
