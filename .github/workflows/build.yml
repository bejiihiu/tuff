name: Build

on:
  push:
    branches-ignore:
      - ver/26.3.x
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # setup-gradle restores ~/.gradle/caches plus the build cache between runs.
      # paperweight artifacts (paperRef checkout, decompiled sources) live outside it and are re-created every run.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"

      # static invariants: no stray folia-* paths, checkstyle regex still covers
      # tuff-server/src/minecraft, all four hooks still present in the patches.
      - name: Guard patch invariants
        run: bash .github/scripts/guard-repo.sh

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace

      # applied-tree invariants: hooks occupy the right place (not just "somewhere
      # that compiles") and the generated checkstyle config still skips NMS.
      - name: Guard applied tree
        run: bash .github/scripts/guard-applied.sh

      # Rebuilding from the applied sources must reproduce the committed patches.
      # A diff means applied sources and .patch files disagree (applied edited
      # without rebuild, or a .patch hand-edited); the next upstream sync then
      # applies a patch that no longer matches what was tested.
      - name: Verify patches reproduce from applied sources
        timeout-minutes: 30
        run: |
          # checkoutPaperRepo already produced the upstream clone in the apply step.
          # Excluding it dodges a paperweight/Gradle 9 implicit-dependency validation
          # error: the rebuild tasks read that clone without declaring the dependency.
          ./gradlew rebuildPaperApiPatches rebuildPaperCheckstylePatches \
            rebuildPaperCheckstyleConfigPatches :tuff-server:rebuildAllServerPatches \
            -x checkoutPaperRepo --stacktrace
          dirs="tuff-api/paper-patches tuff-server/paper-patches tuff-server/minecraft-patches tuff-checkstyle"
          dirty=$(git status --porcelain -- $dirs)
          if [ -n "$dirty" ]; then
            echo "::error::rebuilding the patch set changed it - applied sources and .patch files disagree"
            printf '%s\n' "$dirty"
            git --no-pager diff --stat -- $dirs
            git --no-pager diff -- $dirs | head -200
            exit 1
          fi
          echo "patches are reproducible from the applied sources"

      # build == check (checkstyle + tests of every module) and the paperclip jar is a separate task.
      # javadoc tasks are not part of build, but they run on publish - fail here instead of on a release tag.
      - name: Build and test
        run: >
          ./gradlew build :tuff-server:createPaperclipJar
          :tuff-compute:javadoc :tuff-api:javadoc
          --stacktrace

      # a green build with zero executed compute tests is not green; make the count explicit.
      - name: Verify compute tests ran
        run: |
          results="tuff-compute/build/test-results/test"
          if ! ls "$results"/*.xml >/dev/null 2>&1; then
            echo "no JUnit results under $results - tuff-compute tests did not run" >&2
            exit 1
          fi
          cases=$(cat "$results"/*.xml | grep -c '<testcase ')
          echo "tuff-compute test cases: $cases"
          test "$cases" -gt 0

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            */build/reports/tests
            */build/test-results
          if-no-files-found: ignore
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tuff-paperclip
          path: tuff-server/build/libs/tuff-paperclip-*.jar
          if-no-files-found: error
