# Tuff - server configuration.
#
# Two subsystems read this file. "thread-management" is the unified thread layer: it observes (and
# later manages) the thread pools the server already runs. "async-compute" is the shared worker pool
# for server side work that must not touch world state from a foreign thread: chunk generation,
# pathfinding, AI planning and anything a plugin wants to offload. Workers never own entities or
# chunks; results are handed back to the region thread that asked for them.
#
# Values marked "-1" mean "let the scheduler choose". Durations are written in the unit named in the
# key. Keys you leave out keep their default, unknown keys are reported in the console and ignored,
# and a value that cannot be used is replaced by its default with a warning instead of stopping the
# server.
#
# The file is read at startup and re-read by /tuff reload. Most settings are baked into the running
# pools (enabled, workers, queue capacity, scheduling, metrics, adaptive, dynamic registration, lanes,
# the shutdown grace period and the whole thread-management section); the reload log lists them as
# "takes effect after a restart". Only compute consumer policies can change on a live pool.

thread-management:
  # Master switch of the unified thread layer. When false no runtime is created at all: no pool is
  # registered, no metrics are sampled and no thread is started. /tuff threads still answers and says
  # where the switch is. Changing it needs a restart.
  enabled: true

  resources:
    # Size pools from the platform's real processor count and container limits instead of a static
    # table. Keep this on unless you are diagnosing a wrong topology reading.
    cpu-aware: true
    # Processors never handed to managed pools, kept for GC, JIT, the kernel and unexpected work.
    # Zero is legal but risky on small machines. Changes here need a restart.
    reserve-cores: 1
    # Global cap on concurrently executing leased tasks, or -1 for no cap. Pools still apply their
    # own limits on top.
    max-concurrent-tasks: -1
    # Load shedding. When true and a critical pool (region ticks, network loops) is at its capacity
    # with requests waiting while every non critical pool is already fully leased, the background pools
    # give up one core at a time (never below their declared minimum) and get it back after the critical
    # queue has been calm for a few seconds. Held work is never interrupted; only new leases are
    # refused. The trigger needs a critical pool that can lease, i.e. L3 or deeper; region execution and
    # network are at most L2 in this build, so an enabled policy reports "dormant" and changes nothing.
    # Off keeps the budget fixed whatever the pressure. Needs a restart.
    load-shedding: false

  lifecycle:
    # New server owned threads must come from the central factory. This is a policy statement that
    # code review and the static guard enforce; it does not change threads that already exist.
    centralized-thread-factory: true
    # Sample thread states, CPU time and creation/termination rates. Turning this off keeps the layer
    # running but leaves the counters empty; /tuff threads then says that metrics are disabled.
    monitor-threads: true

  region-execution:
    # Let the thread layer account for Folia's region tick threads. Folia still creates, names and
    # schedules them; the manager wraps the tick body so the thread is registered while it runs. It
    # never creates these threads itself and never changes their class. Off is observation only.
    # Managed mode is a separate, reviewed step and needs its own load test, so the default is off.
    managed: false
    # Must stay true. Folia owns tick order, catch up and region ownership; turning this off is
    # rejected at startup instead of being silently ignored.
    preserve-folia-scheduling: true
    # Region scheduler variant:
    #   edf           - Folia's earliest deadline first, cannot be resized while running (default)
    #   work-stealing - Folia's alternative, supports live resize
    #   kairos        - Tuff's experimental elastic scheduler, also needs kairos-unstable: true
    scheduler: edf
    # Region tick threads, or -1 for Folia's own formula. A fixed count needs a restart; EDF cannot
    # change it while the server runs.
    threads: -1
    # Region grid exponent, between 0 and 31. Smaller regions split the world more finely. Restart
    # only.
    grid-exponent: 4
    # Explicit opt in for the experimental Kairos scheduler. Never enabled implicitly; turning it on
    # without its own A/B run is not supported.
    kairos-unstable: false
    # Limits of the Kairos fund. The floor is threads above; everything here is about growing past it.
    # Only read while scheduler is kairos. Restart only.
    kairos:
      # Let the fund add tick threads while regions wait and retire idle ones afterwards. Off keeps the
      # fixed fund that was already load tested: min == max, no supervisor thread. Turn this on only
      # together with a load test of your own.
      elastic: false
      # Ceiling of the fund, or -1 for the thread layer budget when it runs (otherwise "80% of the
      # cores", the compute budget rule). A budget below the floor leaves the fund fixed and shows up
      # as NO_HEADROOM in /tuff scheduler.
      max-threads: -1
      # How long a thread must sit idle before it may be retired. The floor is never retired.
      keep-alive-seconds: 30
      # How many new tick threads may be started per second while regions are waiting.
      spawn-rate-per-second: 10
      # What one late region is allowed to do. Off by default: the stock behaviour runs one tick body
      # and writes off the whole backlog, which is exactly Folia.
      catch-up:
        # Tick bodies a region may run back to back while it is behind. Each of them accounts for one
        # period, so the missed ticks are actually run instead of skipped; the last body of the burst
        # writes off whatever is left, so the region returns to its normal cadence. 1 is the stock
        # behaviour. The value only takes effect together with a budget above 0.
        cap-ticks: 1
        # Wall clock a single catch-up burst may spend, in milliseconds. 0 disables catch-up, because a
        # cap without a budget would let one slow region hold a permit for a whole tick.
        budget-millis: 50
      steal:
        # How late a tick kept by another runner must be before this runner may take it. Only used
        # while affinity.local-queue-size is above 0.
        threshold-millis: 3
      affinity:
        # Ticks a runner may keep for the region it just ticked. 0 is the stock single queue; above 0
        # is soft affinity: the tick tends to come back to the same thread, and another runner only
        # takes it when it is past `steal.threshold-millis`.
        local-queue-size: 0
      lease:
        # Warn (once per ten seconds) when a tick waited longer than this for its permit. 0 keeps the
        # measurement in /tuff scheduler and the JFR event only, with no log line.
        timeout-seconds: 0
      metrics:
        # Record every executed tick and every supervisor pass as JFR events
        # (tuff.scheduler.Tick, tuff.scheduler.Fund). Off costs one field read per tick. Turn it on for
        # a measurement run, not permanently: the per-tick event is one event per tick per region.
        jfr: false
      # Let tick threads do bounded housekeeping while they have nothing to tick. Off by default and
      # experimental: it can only add work to a thread that is already parked, never to one that is
      # ticking, and it is measured against the tick it precedes. Restart only.
      idle-work:
        # Master switch. Off means neither source below is touched and the fund behaves exactly like it
        # did before this section existed.
        enabled: false
        # A runner that holds a region's permit and is waiting for the deadline may drain that region's
        # intermediate tasks through the handle's own runTasks path, in one slice per wait.
        mid-tick: false
        # A runner with no permit at all may take a job from the thread layer's idle-safe source. The
        # only producer shipped is the one-second metrics refresh of that layer; it runs at most once
        # every five seconds on an idle fund, and the refresher thread keeps the rest.
        utmi-jobs: false
        # Wall clock one slice of idle work may take, in milliseconds. A slice that overruns is the
        # signal below, not a second chance.
        slice-millis: 1
        # Lateness a tick may suffer because of idle work before the whole idle path disables itself.
        # It re-arms after five seconds without another violation. 0 disables idle work on the first
        # late tick.
        max-added-lag-millis: 5
        # Most of a one second window idle work may spend, in percent. 0 disables it as well.
        max-share-percent: 25

  async-compute:
    # Older spelling of execution-pools.compute.managed below: both keys describe one switch and
    # either one turns compute management on. Prefer the execution-pools key. Off keeps the engine's
    # own sizing and its own queue; the engine is observed either way. Needs a restart.
    managed: false
    # Ceiling for that pool, or -1 to keep the engine's configured maximum.
    max-threads: -1

    # Cores the compute pool gives back while the regions fall behind. Off by default: it changes the
    # size of a live pool and needs its own load test. Only a managed compute pool can apply it; an
    # observed one logs the decisions and /tuff threads shows them, but nothing is resized.
    tick-pressure:
      enabled: false
      # Pressure starts when at least this share of regions is below 18 TPS (0.25 = one of four
      # regions), or when the slowest region drops below enter-min-tps.
      enter-lag-fraction: 0.25
      enter-min-tps: 19.0
      # The reserve is released only when no region is below 18 TPS and the slowest region is at or
      # above exit-min-tps. The gap between the two TPS values is the hysteresis band.
      exit-min-tps: 19.5
      # Consecutive one-second samples that must be calm before a core is returned.
      exit-windows: 3
      # Minimum seconds between two reserve changes. Keeps a sawtooth from resizing the pool every
      # second.
      cooldown-seconds: 5
      # Most cores the pool may give up, and how many move per decision. The pool never falls below
      # its own min-threads, and the budget it yields is the pool's own cap after its max-threads and
      # load shedding, not the ledger's usable number.
      max-reserve-cores: 2
      step-cores: 1

  execution-pools:
    network:
      # Influence the network event loop pools. Off observes them only; their sizing, ordering and
      # affinity stay netty's.
      managed: false
      # Must stay true. Network loops cannot be merged or reshaped without changing their semantics;
      # turning this off is rejected at startup.
      preserve-specialization: true
    chunk-system:
      # Influence the chunk generation and chunk IO pools. Off observes them only.
      managed: false
      # Must stay true, for the same reason as above.
      preserve-specialization: true
    compute:
      # managed = the compute engine takes its worker threads and its processor budget from this
      # thread layer instead of creating both itself. Off keeps the engine's own factory and its own
      # budget arithmetic; the pool is observed either way. Needs a restart.
      managed: false
      # Must stay true. Compute workers are never merged with region, chunk or network threads.
      preserve-specialization: true

  metrics:
    # Collect pool and thread state at all. With collection off the other flags have no effect; the
    # snapshot stays structural (registered pools, registry threads, -1 for everything unmeasured) and
    # /tuff threads says that metrics are disabled. It never fakes measured zeros.
    enabled: true
    # Publish per pool counters and saturation.
    per-pool: true
    # Publish the per thread list. Disabling it keeps pool totals but removes individual threads.
    per-thread: true

async-compute:
  # Master switch. When false the scheduler starts no worker threads and every submission is
  # rejected; /tuff status still answers so the state is visible.
  enabled: true

  workers:
    # Worker threads. -1 sizes the pool from the CPU budget left after the region, chunk and IO
    # threads already running on the machine. A positive number is requested, but the pool ceiling
    # can still lower it: max-threads when it is set, otherwise the processor budget. The startup
    # log warns when that happens, and /tuff shows both the requested and the live count.
    threads: -1
    # Workers kept alive while idle. At least 1.
    min-threads: 2
    # Hard ceiling for the pool, or -1 for "one worker per usable processor".
    max-threads: -1
    # Seconds an idle worker above min-threads is kept before it exits. Must be positive.
    keep-alive-seconds: 30
    # Prefix of worker thread names, visible in thread dumps and profilers.
    thread-name-prefix: "Tuff Compute Worker"

  queue:
    # Maximum number of queued tasks across all consumers. Protects the heap from a submission
    # burst rather than slowing the submitting thread down. At least 1.
    capacity: 8192
    # What happens when the queue is full:
    #   reject      - refuse the new submission and let the caller decide (safest)
    #   drop-oldest - cancel the oldest queued task of the same consumer to make room
    overflow-policy: reject

  scheduling:
    # How the next task is picked:
    #   weighted-fair - highest priority first, dispatch turns split between consumers by weight
    #   priority      - strict priority order, aged so low priority work still runs
    #   fifo          - submission order, ignores priority and weight (benchmark baseline)
    strategy: weighted-fair
    # Let an idle worker take a task that belongs to another worker's local batch. Only enable it
    # when benchmarks show a gain.
    work-stealing: false
    # Raise the effective priority of long waiting tasks so background work cannot starve.
    priority-aging: true
    # Milliseconds a task waits before it gains one aging step. Must be positive.
    aging-interval-millis: 1000
    # Highest number of aging steps a task may gain. At least 1.
    max-aging-boost: 3
    # Milliseconds an idle worker waits for work before it parks or retires. Must be positive.
    idle-wait-millis: 50

  consumers:
    # Whether a submission under an unknown consumer id registers that consumer on the fly with the
    # policy from "default". When false such submissions are rejected as unknown. At most 256 ids
    # can be registered this way at the same time; further unknown ids are rejected, and a
    # configured consumer section is never counted against that limit.
    allow-dynamic-registration: true

    # Policy for consumers without a section of their own, and the base for the overrides below:
    # every key you leave out of a consumer section is inherited from here.
    default:
      enabled: true
      # Tasks of one consumer that may run at the same time:
      #   -1    - the whole pool (default)
      #   0.60  - a share of the pool; fractions are written with a decimal point
      #   4     - a fixed number of tasks; whole numbers are absolute counts
      # A share is a cap, not a reservation: it never guarantees that those slots are free.
      max-concurrent: -1
      # Relative dispatch weight while consumers compete for the pool; 2.0 means twice as many
      # dispatch turns as 1.0.
      fair-share-weight: 1.0
      # Queued (not running) tasks of this consumer, or -1 for no per consumer bound.
      max-queued-tasks: -1
      # Overflow behaviour for this consumer when its bound or the global queue is full.
      overflow-policy: reject
      # Seconds a task of this consumer may wait in the queue before it is cancelled. 0 disables
      # the expiry.
      max-queue-wait-seconds: 0

    # The three consumers below are the server subsystems that offload work first. Their limits are
    # relative shares, not CPU guarantees - tune them under real load.
    chunk-generation:
      enabled: true
      max-concurrent: 0.60
      fair-share-weight: 1.0
      max-queued-tasks: -1
      overflow-policy: reject
      max-queue-wait-seconds: 0

    pathfinding:
      enabled: true
      max-concurrent: 0.30
      fair-share-weight: 1.0
      max-queued-tasks: -1
      overflow-policy: reject
      max-queue-wait-seconds: 0

    ai-computation:
      enabled: true
      max-concurrent: 0.20
      fair-share-weight: 1.0
      max-queued-tasks: -1
      overflow-policy: reject
      max-queue-wait-seconds: 0

  metrics:
    # Counters and gauges: queue size, active and idle workers, submitted, completed, rejected,
    # failed, wait and execution averages, throughput.
    enabled: true
    # Emit Java Flight Recorder events for submissions, executions and worker state changes.
    jfr: false
    # Seconds in the rolling window used for throughput and averages. Must be positive.
    throughput-window-seconds: 10
    # Estimate pool CPU utilisation from busy worker time. Coarse by design and never a system wide
    # reading.
    sample-cpu: true
    # Seconds between gauge samples for JFR and periodic logging. Must be positive.
    sample-interval-seconds: 1

  adaptive:
    # Let the scheduler move the concurrency limit between min-concurrency and max-concurrency based
    # on observed queue wait instead of claiming more work than the machine can chew.
    enabled: false
    # Lowest limit the controller may pick. At least 1.
    min-concurrency: 1
    # Highest limit, or -1 for the whole worker pool with no adaptive-specific cap. The controller
    # never asks the pool for more than it can run, so -1 is not "current size".
    max-concurrency: -1
    # Seconds over which samples are aggregated before a decision. Must be positive.
    sample-window-seconds: 5
    # Finished tasks needed in a window before the limit may move. At least 1.
    min-samples: 20
    # Additive increase applied when the pool is not saturated, in (0.0, 1.0].
    increase-step: 0.1
    # Multiplicative decrease applied when latency degrades, in (0.0, 1.0).
    decrease-factor: 0.5
    # Estimated utilisation the controller aims for, in (0.0, 1.0].
    target-utilization: 0.9

  lanes:
    # Execution lanes. The platform lane is the worker pool above. The virtual lane runs tasks on
    # Java virtual threads and has its own hard limit of concurrent tasks.
    #
    # The virtual lane is for blocking or IO bound work, and as a deadlock breaker when a task waits
    # on something a worker thread would otherwise hold up. Virtual threads add no CPU parallelism:
    # CPU bound work on the lane competes with the platform workers for the same cores and can slow
    # the server down, so keep CPU bound work on the platform lane.
    virtual:
      # Create the virtual lane. When false, LOW tasks fall back to the platform workers, which is
      # the behaviour before lanes existed. Changing this needs a restart.
      enabled: true
      # Route LOW priority tasks to the virtual lane. They never occupy a platform worker; when the
      # lane limit is reached they wait in the bounded queue instead of moving to the workers.
      low-priority: true
      # Let NORMAL tasks spill to the virtual lane while every platform worker is busy and one of
      # the thresholds below is met. HIGH and CRITICAL tasks never spill.
      normal-spill: true
      # Hard limit of virtual tasks executing at the same time. At least 1. This is a ceiling, not a
      # reservation, and the lane never grows the platform pool or the processor budget.
      max-concurrent: 64
      # Milliseconds a NORMAL task must have waited before it may spill while the platform pool is
      # saturated. 0 means every waiting NORMAL task may spill as soon as the pool is full.
      spill-wait-millis: 50
      # NORMAL queue depth at which a task may spill regardless of its wait. 0 turns the depth
      # trigger off, so spill-wait-millis stays the only condition.
      spill-queue-depth: 64

  # Seconds a graceful shutdown lets running tasks finish. Queued tasks that did not start are
  # cancelled. Kept short on purpose: the world save runs right after the pool stops and /restart
  # gives the server about ten seconds in total, so grace plus the shutdown wait has to fit there.
  # The whole stop waits at most five seconds (or grace + 1 s, whichever is smaller), so a large
  # value here cannot stall the restart forever.
  shutdown-grace-seconds: 5
